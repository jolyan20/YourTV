name: Weekly SPA photos

# Every Friday: up to 10 new photos from the Saudi Photos Hub (cc.spa.gov.sa, CC BY-SA 4.0), captioned,
# night-tagged and credited, straight onto master. The TVs pick them up with the next photo set.
on:
  schedule:
    - cron: '0 3 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Fetch, caption, tag
        run: |
          python .github/tools/fetch_spa.py 10
          python .github/tools/apply_captions.py
          python .github/tools/tag_night.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos docs/PHOTO-CREDITS.md
          git diff --cached --quiet && { echo "no new photos"; exit 0; }
          git commit -m "Weekly photos from the Saudi Photos Hub"
          git push
