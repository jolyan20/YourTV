  :root{
    --sand:#F6EFE0;
    --dim:#C3B8A2;
    --gold:#DCB86F;
    --green-lt:#57D294;
    --red:#EE6A50;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* Hidden until the clock, the saved panels and the photo are in place, then one fade in: no half-built
     frames. The delayed animation shows it anyway if the script ever fails. */
  body{opacity:0;animation:reveal .3s 2.5s forwards}
  html.ready body{opacity:1;animation:none;transition:opacity .3s ease}
  @keyframes reveal{to{opacity:1}}
  /* card-only mode for the launcher */
  html.widget,html.widget body{background:transparent}
  html.widget .photo,html.widget .veil,html.widget .grain,html.widget .top-veil,html.widget .bottom-veil,
  html.widget .dimmer,html.widget #credit,html.widget .dots,html.widget .top,html.widget .clockwrap,html.widget .bottom{display:none}
  html.widget .stage{height:auto;padding:0;display:block;transition:none}
  html.widget .mid{display:block}
  html.widget .week{width:100%}
  html,body{
    height:100%;overflow:hidden;background:#040E09;color:var(--sand);
    font-family:'Thmanyah',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;cursor:none;
  }

  .photo{
    position:fixed;inset:0;z-index:0;
    background-image:none;
    background-color:#040E09;
    background-size:cover;
    background-position:center 26%;
    background-repeat:no-repeat;
    transform:scale(1.03);   /* edges stay covered while it settles */
  }
  /* each photo's darkness as a plain black layer: same look as filter:brightness, nothing to recompute */
  .photo::after{content:'';position:absolute;inset:0;background:#000;opacity:var(--dim,.05)}
  .veil{
    position:fixed;inset:0;z-index:1;
    background:
      linear-gradient(180deg,rgba(3,10,7,.62) 0%,rgba(3,10,7,.30) 22%,rgba(3,10,7,.12) 46%,rgba(3,10,7,.42) 74%,rgba(2,6,4,.88) 100%),
      radial-gradient(120% 85% at 22% 34%,rgba(3,14,9,.42) 0%,rgba(3,14,9,0) 58%);
  }
  /* the photo's description, small, under the bottom panels (full credits in docs/PHOTO-CREDITS.md) */
  #credit{
    position:fixed;left:3.6vw;bottom:1.1vh;z-index:6;text-align:left;direction:rtl;
    font-size:clamp(11px,.72vw,15px);font-weight:300;letter-spacing:.02em;
    color:rgba(246,239,224,.55);pointer-events:none;white-space:nowrap;
  }
  #credit:empty{display:none}
  .grain{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  }
  .top-veil{
    position:fixed;left:0;top:0;width:56vw;height:34vh;z-index:3;pointer-events:none;
    background:radial-gradient(120% 100% at 0% 0%,rgba(2,9,6,.82) 0%,rgba(2,9,6,.42) 45%,rgba(2,9,6,0) 76%);
  }
  .bottom-veil{
    position:fixed;left:0;right:0;bottom:0;height:30vh;z-index:3;pointer-events:none;
    background:linear-gradient(180deg,rgba(2,7,4,0) 0%,rgba(2,7,4,.55) 42%,rgba(2,6,4,.86) 100%);
  }

  .stage{
    position:relative;z-index:5;height:100vh;
    padding:3.1vh 3.6vw 5.4vh;
    display:grid;grid-template-rows:auto 1fr auto;gap:1.5vh;
  }

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2.5vw}

  .up{color:var(--green-lt)}.down{color:var(--red)}

  .week{
    width:min(760px,48vw);justify-self:end;
    background:rgba(4,14,9,.60);   /* no backdrop blur: over a moving photo it is redone every frame */
    border:1px solid rgba(220,184,111,.16);
    border-radius:12px;
    padding:1.7vh 1.4vw;
  }
  .week .hd{
    display:flex;align-items:center;gap:.7em;margin-bottom:1vh;
    font-size:clamp(12px,1vw,18px);font-weight:500;letter-spacing:.18em;color:#D6AF6B;
  }
  .week .hd .hd-ic svg{width:1.45em;height:1.45em;display:block}
  .week .hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(220,184,111,.5),transparent)}
  .week ul{list-style:none;display:flex;flex-direction:column;gap:0}
  .week li{
    display:flex;align-items:baseline;gap:1.05em;
    font-size:clamp(14px,1.16vw,22px);font-weight:400;color:#F6EEDC;
    white-space:nowrap;line-height:1.3;
    padding:.8vh 0;border-bottom:1px solid rgba(220,184,111,.13);
  }
  .week li:last-child{border-bottom:none}
  .week li span:first-child{flex:0 1 auto;max-width:68%;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em}
  .week li .ep{flex:0 0 auto;color:#9FB8A8;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .rt{flex:0 0 auto;color:#E0BA74;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .dt{flex:1 1 auto;color:#9C9279;font-size:.72em;min-width:3.2em;text-align:left}
  .week ul.flip li{animation:weekIn .5s ease both}
  .week ul.flip li:nth-child(2){animation-delay:.06s}
  .week ul.flip li:nth-child(3){animation-delay:.12s}
  .week ul.flip li:nth-child(4){animation-delay:.18s}
  .week ul.flip li:nth-child(5){animation-delay:.24s}
  @keyframes weekIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .week li.past{color:#8F8670}
  .week li.next{color:#FFE9B8}
  .week li.next .dt{color:#E0BA74}
  .week li.quote{white-space:normal;display:block;font-size:clamp(17px,1.5vw,29px);line-height:1.75;
    border-bottom:none;padding:.4vh 0 0;color:#FFF7E6}
  /* Thmanyah draws ﴿﴾ as small angle marks: they come from the NotoMarks subset */
  .week li.quote .orn{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:#D6AF6B;
    font-size:1.05em;padding:0 .15em}
  /* ﷺ is not in Thmanyah either: NotoMarks, in gold like the verse brackets so it reads as ornament */
  .week li.quote .saw{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:#D6AF6B;font-size:1.6em;line-height:1;vertical-align:-.1em}
  /* a full hadith: the isnad and the narration small and muted, the Prophet's words ﷺ at full size */
  .week li.quote.hadith{font-size:clamp(15px,1.3vw,25px);line-height:1.7}
  .week li.quote .nar{font-size:.66em;color:#B9AE96}
  .week li.quote .nar .saw{font-size:1.45em}
  .week li.src{border-bottom:none;padding:.6vh 0 0;font-size:clamp(12px,.95vw,18px);color:#D6AF6B}
  .week .empty{color:#9A9078;font-size:clamp(14px,1.1vw,21px);font-weight:300;margin-top:1vh}

  .dates{text-align:right;flex-shrink:0}
  .hijri{font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand);line-height:1.3}
  .greg{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim)}
  /* starts at the screen edge, under the first letters, and fades toward the middle */
  .rule{margin-top:1.2vh;width:clamp(100px,9vw,190px);height:1px;margin-left:auto;margin-right:0;
    background:linear-gradient(270deg,var(--gold),rgba(220,184,111,0))}

  /* the card keeps its width on the left; the clock is centred in the space between it and the right edge */
  .mid{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4.5vw}
  .clockwrap{display:flex;flex-direction:column;align-items:center;justify-self:center}
  .clock{
    display:flex;align-items:baseline;justify-content:center;direction:ltr;
    font-family:'ThmanyahDisplay','Thmanyah',serif;
    font-weight:700;
    font-size:clamp(120px,min(17vw,31vh),345px);line-height:.92;letter-spacing:.022em;
    color:#FFFDF6;font-variant-numeric:tabular-nums;
    text-shadow:0 4px 70px rgba(0,0,0,.65), 0 0 130px rgba(255,236,190,.12);
  }
  .clock .d{unicode-bidi:isolate}
  .clock .d i{font-style:normal}
  .clock .d i + i{margin-left:var(--digit-gap,.09em)}
  .clock .sep{
    font-size:.46em;align-self:center;transform:translateY(-.08em);color:var(--gold);opacity:.9;padding:0 .1em;
  }
  .clock .ampm{
    font-size:.28em;font-weight:500;color:var(--gold);
    align-self:flex-start;margin-top:.12em;margin-inline-end:.25em;
  }
  .subline{
    margin-top:1.4vh;display:flex;align-items:center;gap:.7em;
    font-size:clamp(12px,1.02vw,20px);font-weight:300;letter-spacing:.3em;color:#D8CDB6;
  }
  .subline .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.9}

  .bottom{
    display:grid;grid-template-columns:.9fr .8fr 1.6fr;
    gap:2.4vw;align-items:start;
    border-top:1px solid rgba(220,184,111,.30);
    padding-top:2.1vh;
  }
  .panel{min-width:0}
  .panel .label{
    font-size:clamp(12px,.98vw,18px);font-weight:500;letter-spacing:.2em;
    color:#D6AF6B;margin-bottom:.8vh;white-space:nowrap;
  }
  .panel .big{
    display:flex;align-items:baseline;gap:.4em;flex-wrap:nowrap;white-space:nowrap;min-width:0;line-height:1.1;
    font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:clamp(22px,2vw,42px);color:var(--sand);
  }
  .panel .num{color:#FFFCF2;font-size:1.12em;font-variant-numeric:tabular-nums;font-weight:500}
  .panel .unit{font-size:.56em;font-weight:500;color:var(--gold)}
  .panel .sub{
    margin-top:.85vh;font-size:clamp(12px,1vw,19px);font-weight:300;color:#C6BBA4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em;
  }
  .panel .sub b{color:#F0E6D0;font-weight:500}

  .p-prayer{text-align:right}
  .p-prayer .big{justify-content:flex-start}
  .p-mid{text-align:center}
  .p-mid .big{display:block;text-align:center;line-height:1.06}
  .p-mid .num{font-size:1.3em;line-height:1}
  .p-mid .unit{font-size:.46em;font-weight:500;color:#D6AF6B;letter-spacing:.02em;display:inline;vertical-align:.5em}
  .p-match{text-align:left}
  .p-match .big{justify-content:flex-end}
  .p-match .sub{white-space:normal;line-height:1.4;max-width:100%;font-size:clamp(11px,.88vw,17px)}

  .mrow{display:flex;flex-direction:row;gap:1.6vw;align-items:flex-end;justify-content:flex-end;min-width:0}
  .mblock{text-align:left;flex:0 1 auto;min-width:0;max-width:100%}
  .mblock:not(:last-child){padding-inline-end:1.6vw;border-inline-end:1px solid rgba(220,184,111,.25)}
  .mrow:has(.mblock + .mblock) .big{font-size:clamp(16px,1.32vw,28px)}
  .mrow .crest{margin:0 .15em}
  .mblock .big{justify-content:flex-end;min-width:0}
  .mrow.flip .mblock{animation:weekIn .5s ease both}
  .mrow.flip .mblock + .mblock{animation-delay:.08s}
  .mblock .big > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
    padding-bottom:.3em;margin-bottom:-.3em}  /* room for the dots under ي, ج… */
  .none-week{font-size:clamp(26px,2.5vw,54px);font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;color:#A79C85}

  /* A new photo settles in over a minute, then holds still: an endless drift kept the TV redrawing
     the whole screen 60 times a second, for hours. */
  @keyframes settle{
    from{transform:scale(1.055) translate3d(-.55%,-.4%,0)}
    to{transform:scale(1.03) translate3d(0,0,0)}
  }
  @media (prefers-reduced-motion:no-preference){.photo.settle{animation:settle 60s ease-out both}}

  /* ===== top left: weather and markets, set like the date block on the right (no boxes) ===== */
  .markets{text-align:left;flex-shrink:0}
  .wxline{display:flex;align-items:baseline;gap:.5em;justify-content:flex-end;line-height:1.3;
    font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand)}
  .wxt{font-family:'ThmanyahDisplay','Thmanyah',serif;font-weight:700;color:#FFFCF2;direction:ltr;
    font-variant-numeric:tabular-nums}
  .wxd.dust{color:#E8B86A}
  .wxsub{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim);white-space:nowrap}
  .wxr:not(:empty)::before{content:'  ·  ';white-space:pre;color:rgba(214,175,107,.7)}
  .wxt:empty,.wxd:empty,.wxr:empty{display:none}
  .rule.l{margin-left:0;margin-right:auto;background:linear-gradient(90deg,var(--gold),rgba(220,184,111,0))}
  /* today's five prayers where the markets were: past ones dim, the next one gold with the time left */
  .pt{margin-top:1.2vh;display:flex;justify-content:flex-end;gap:1.3em;white-space:nowrap;direction:rtl;
    font-size:clamp(12px,1.06vw,21px);font-weight:400;color:#D8CDB6}
  .pt .q{display:flex;flex-direction:column;align-items:center;gap:.15em;line-height:1.25}
  .pt .q .n{font-size:.82em;color:#C6BBA4}
  .pt .q .t{font-variant-numeric:tabular-nums}
  .pt .q.past{opacity:.5}
  .pt .q.next{opacity:1;padding:.25em .7em;margin:-.25em -.2em;border-radius:10px;
    background:rgba(220,184,111,.22);border:1.5px solid rgba(232,196,111,.9);box-shadow:0 0 22px rgba(220,184,111,.25)}
  .pt .q.next .n,.pt .q.next .t{color:#FFE7AE;font-weight:600}
  .pt-left{margin-top:.7vh;text-align:left;font-size:clamp(12px,1vw,19px);font-weight:300;color:#C6BBA4;white-space:nowrap}
  .pt-left b{color:#F1CF8A;font-weight:500}
  .p-mid .greet{font-size:.8em;color:#FFE2A6}
  .p-mid .cd{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
  .pt .q.aux .n,.pt .q.aux .t{color:#A9B4C2}
  .pt .q.aux .n{font-size:.74em}
  /* the card: each one slides in from above and leaves downward, slowly; dots beside it show which one */
  .week{position:relative}
  .wbody{transition:transform 1.1s cubic-bezier(.4,0,.2,1),opacity 1.1s ease}
  .wbody.out{transform:translateY(5vh);opacity:0}

<body>
<div class="photo"></div>
<div id="credit"></div>
<div class="veil"></div>

<script>
// daily background: one photo per Riyadh day, deterministic
const BGS = [
  {u:"https://raw.githubusercontent.com/jolyan20/YourTV/master/assets/backgrounds/9hWJs7iblh8.jpg", c:"NEOM · Unsplash", t:"الغروب على جبال الصحراء · نيوم", d:0.9},

  {u:"https://raw.githubusercontent.com/jolyan20/YourTV/master/assets/backgrounds/t3dlLOhdEzs.jpg", c:"NEOM · Unsplash", t:"سلسلة جبال في الصحراء · نيوم", d:0.99},
  {u:"https://raw.githubusercontent.com/jolyan20/YourTV/master/assets/backgrounds/LAj90eAXOZA.jpg", c:"NEOM · Unsplash", t:"بحر تحيط به الجبال · نيوم", d:0.96},
  {u:"https://raw.githubusercontent.com/jolyan20/YourTV/master/assets/backgrounds/f5ZB0LHwi0s.jpg", c:"Hala AlGhanim · Unsplash", t:"برج المملكة · الرياض", d:0.88}

// the app passes the chosen city in the URL fragment: #city=..&lat=..&lon=..&tz=..
const _Q = new URLSearchParams((location.hash || '').replace(/^#/, ''));
const _list = k => (_Q.get(k) || '').split(',').map(x=>x.trim()).filter(Boolean);

// Intl.DateTimeFormat is slow to build and the clock asks for one several times a second: one per locale+options
const IDF_CACHE = {};
function IDF(loc, opt){ const k = loc + JSON.stringify(opt || {}); return IDF_CACHE[k] || (IDF_CACHE[k] = new Intl.DateTimeFormat(loc, opt)); }
// write only what changed: no relayout every second for the same text
function setHTML(el, html){ if(el && el.__h !== html){ el.innerHTML = html; el.__h = html; } }
// the old content fades out over the new one as it fades in
function crossfade(el, update){
  if(!el || !el.parentNode || document.hidden){ update(); return; }
  const g = el.cloneNode(true);
  g.removeAttribute('id'); g.querySelectorAll('[id]').forEach(x => x.removeAttribute('id'));
  g.classList.remove('xf-in'); g.classList.add('xf-ghost');
  Object.assign(g.style, {position:'absolute', left: el.offsetLeft + 'px', top: el.offsetTop + 'px',
    width: el.offsetWidth + 'px', height: el.offsetHeight + 'px', margin: 0});
  el.parentNode.insertBefore(g, el);
  update();
  el.classList.remove('xf-in'); void el.offsetWidth; el.classList.add('xf-in');
  requestAnimationFrame(() => g.classList.add('xf-gone'));
  setTimeout(() => g.remove(), 1000);
}
// a live countdown: hh:mm:ss (and days), kept current by tickCountdowns every second
function cdText(ms){
  const t = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), x = t % 60;
  const hms = ar(pad(h)) + ':' + ar(pad(m)) + ':' + ar(pad(x));
  return d ? (d === 1 ? 'يوم' : d === 2 ? 'يومين' : ar(d) + (d <= 10 ? ' أيام' : ' يوم')) + ' و ' + hms : hms;
}
const cdn = (t, done) => `<span class="cdn" data-to="${t}" data-done="${done || 'الآن'}">${cdText(t - Date.now())}</span>`;
function tickCountdowns(){
  const now = Date.now();
  document.querySelectorAll('[data-to]').forEach(el => {
    const left = +el.dataset.to - now, txt = left > 0 ? cdText(left) : el.dataset.done;
    if(el.textContent !== txt) el.textContent = txt;
  });
}
const GREG = 'ar-SA-u-ca-gregory-nu-arab';
const AR = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const ar = s => String(s).replace(/[0-9]/g, d => AR[+d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

function riyadhParts(d = new Date()){
  const f = IDF('en-GB',{
    timeZone: CONFIG.timezone, hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  }).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});
  return { y:+f.year, mo:+f.month, d:+f.day, h:(+f.hour)%24, mi:+f.minute, s:+f.second };
}
function fmt12(h, mi){
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ar(h12)}:${ar(pad(mi))} ${h < 12 ? 'ص' : 'م'}`;
}

function tickClock(){
  const p = riyadhParts();
  const h12 = p.h % 12 === 0 ? 12 : p.h % 12;
  // one box per digit: browsers ignore letter-spacing on Arabic digits, and ٤ reaches into the next digit
  const digits = s => [...s].map(ch => '<i>' + ch + '</i>').join('');
  const key = h12 + ':' + p.mi;
  if(key === tickClock.last) return;   // ticks every second, redraws once a minute
  tickClock.last = key;
  document.getElementById('ck-h').innerHTML = digits(ar(h12));
  document.getElementById('ck-m').innerHTML = digits(ar(pad(p.mi)));
  document.getElementById('ck-ap').textContent = p.h < 12 ? 'ص' : 'م';
  const h24 = document.getElementById('ck-24');
  if(h24) h24.textContent = ar(pad(p.h)) + ':' + ar(pad(p.mi));
  applyMode();
}

function wxIcon(code, night){
  if(code === 'dust') return ICON.dust;
  if(code === 0 || code === 1) return night ? ICON.moon : ICON.sun;
  if(code === 2) return night ? ICON.cloud : ICON.partly;
  if(code === 3) return ICON.cloud;
  if(code === 45 || code === 48) return ICON.fog;
  if(code >= 95) return ICON.storm;
  if((code >= 71 && code <= 77) || code === 85 || code === 86) return ICON.snow;
  if(code >= 51) return ICON.rain;
  return ICON.cloud;
}
function minutesOf(k, dflt){
  const v = DAY_TIMES && DAY_TIMES[k];
  if(!v) return dflt;
  const [h, mi] = String(v).split(':').map(Number);
  return h*60 + mi;
}
function isNight(){
  const p = riyadhParts(), m = p.h*60 + p.mi;
  return m < minutesOf('Sunrise', 6*60) || m >= minutesOf('Maghrib', 18*60);
}
let MODE = null;
function applyMode(){
  const night = isNight();
  if(night === MODE) return;
  const first = MODE === null;
  MODE = night;
  document.documentElement.classList.toggle('night', night);
  const el = document.getElementById('mode');
  if(el){ el.innerHTML = (night ? ICON.moon : ICON.sun) + '<b>' + (night ? 'ليل' : 'نهار') + '</b>'; el.classList.toggle('n', night); }
  if(!first){ applyBackground(true); paintWeatherIcon(); }
}

const PRAYER_KEYS = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const PRAYER_NAMES = {Fajr:'الفجر',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
let PRAYERS = [];

let DAY_TIMES = null;
function buildPrayers(t){
  DAY_TIMES = t;
  PRAYERS = PRAYER_KEYS.map(k=>{
    const [h,mi] = String(t[k]).split(':').map(Number);
    return {key:k, name:PRAYER_NAMES[k], h, mi};
  });
}

// Umm al-Qura: Fajr at 18.5°, Maghrib at sunset, Isha 90 min after Maghrib (120 in Ramadan),
// Asr at shadow factor 1. Same method as Aladhan's method 4, so the offline times match to a minute or two.
function computePrayers(){
  const p = riyadhParts(), lat = CONFIG.latitude, lng = CONFIG.longitude;
  const tz = Math.round((Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s) - Date.now()) / 60000) / 60;
  const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
  const fix = (a,b) => { a = a - b*Math.floor(a/b); return a < 0 ? a + b : a; };
  const jd0 = Date.UTC(p.y,p.mo-1,p.d)/86400000 + 2440587.5 - lng/(15*24);
  const sun = t => {
    const D = jd0 + t - 2451545;
    const g = fix(357.529 + .98560028*D, 360), q = fix(280.459 + .98564736*D, 360);
    const L = fix(q + 1.915*Math.sin(rad(g)) + .020*Math.sin(rad(2*g)), 360);
    const e = 23.439 - .00000036*D;
    const RA = fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)), Math.cos(rad(L))))/15, 24);
    return {decl: deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))), eqt: q/15 - RA};
  };
  const noon = t => fix(12 - sun(t/24).eqt, 24);
  const angleTime = (angle, t, ccw) => {
    const d = sun(t/24).decl, n = noon(t);
    const T = deg(Math.acos((-Math.sin(rad(angle)) - Math.sin(rad(d))*Math.sin(rad(lat))) /
                            (Math.cos(rad(d))*Math.cos(rad(lat)))))/15;
    return n + (ccw ? -T : T);
  };
  const asrTime = t => {
    const d = sun(t/24).decl;
    const a = -deg(Math.atan(1/(1 + Math.tan(rad(Math.abs(lat - d))))));
    return angleTime(a, t, false);
  };
  const adj = h => h + tz - lng/15;
  const fajr = adj(angleTime(18.5, 5, true)), dhuhr = adj(noon(12)), asr = adj(asrTime(13));
  const sunrise = adj(angleTime(.833, 6, true));
  const maghrib = adj(angleTime(.833, 18, false));
  const isha = maghrib + (hijriMonthNow() === 9 ? 120 : 90)/60;
  const hm = h => { const m = Math.round(fix(h, 24)*60) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m%60); };
  return {Fajr:hm(fajr), Sunrise:hm(sunrise), Dhuhr:hm(dhuhr), Asr:hm(asr), Maghrib:hm(maghrib), Isha:hm(isha)};
}

async function loadPrayers(){
  const p = riyadhParts();
  const url = `https://api.aladhan.com/v1/timings/${pad(p.d)}-${pad(p.mo)}-${p.y}`
            + `?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}`
            + `&method=${CONFIG.prayerMethod}&timezonestring=${encodeURIComponent(CONFIG.timezone)}`;
  try{
    const r = await fetchT(url, 12000);
    const j = await r.json();
    if(!j?.data?.timings?.Fajr) throw 0;
    buildPrayers(j.data.timings);
  }catch(e){
    try{ buildPrayers(computePrayers()); }catch(_){}
  }
  tickPrayer();
  tickRamadan();   // Ramadan mode needs the prayer times
  if(CONFIG.panel === 'prayers' || CONFIG.panel === 'home') renderPanel(false);
}

const UNIT = {
  day: {one:'يوم', two:'يومين', few:'أيام', many:'يوم'},
  hour:{one:'ساعة', two:'ساعتين', few:'ساعات', many:'ساعة'},
  min: {one:'دقيقة', two:'دقيقتين', few:'دقائق', many:'دقيقة'}
};
function qty(n,u){
  if(n === 1) return u.one;
  if(n === 2) return u.two;
  if(n >= 3 && n <= 10) return `${ar(n)} ${u.few}`;
  return `${ar(n)} ${u.many}`;
}
function humanRemaining(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), out = [];
  if(h) out.push(qty(h,UNIT.hour));
  if(m || !h) out.push(qty(m,UNIT.min));
  return out.join(' و ');
}
function shortRemaining(ms){
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000);
  const out = [];
  if(d) out.push(qty(d,UNIT.day));
  if(h && out.length < 2) out.push(qty(h,UNIT.hour));
  if(!out.length) out.push(qty(Math.max(1, Math.ceil(ms/60000)), UNIT.min));
  return out.join(' و ');
}

function isFriday(){
  return IDF('en-US',{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date()) === 'Fri';
}
function prayerName(x){ return x.key === 'Dhuhr' && isFriday() ? 'الجمعة' : x.name; }

function tickPrayer(){
  const elL=document.getElementById('prayer-label'),
        elN=document.getElementById('prayer-name'),
        elT=document.getElementById('prayer-time'),
        elC=document.getElementById('prayer-count'),
        panel=document.querySelector('.p-prayer');
  if(!PRAYERS.length) return;
  const p = riyadhParts();
  const mins = p.h*60 + p.mi + p.s/60;
  renderPrayerStrip(mins);
  renderAlerts();

  // between adhan and iqama: show the iqama countdown
  const cur = PRAYERS.find(x=>{
    const at = x.h*60 + x.mi;
    const gap = (x.key === 'Dhuhr' && isFriday()) ? 0 : (CONFIG.iqama[x.key] || 0);
    return mins >= at && mins < at + gap;
  });
  if(cur){
    const left = (cur.h*60 + cur.mi + CONFIG.iqama[cur.key]) - mins;
    panel.classList.add('now');
    elL.textContent = 'حان الآن';
    elN.textContent = prayerName(cur);
    elT.textContent = fmt12(cur.h, cur.mi);
    elC.innerHTML = 'الإقامة بعد <b>' + humanRemaining(Math.max(60, Math.ceil(left)*60)) + '</b>';
    return;
  }

  panel.classList.remove('now');
  elL.textContent = 'الصلاة القادمة';
  let next = PRAYERS.find(x => (x.h*60+x.mi) > mins);
  const leftM = next ? (next.h*60 + next.mi) - mins
                     : (PRAYERS[0].h*60 + PRAYERS[0].mi) + 1440 - mins;
  if(!next) next = PRAYERS[0];
  elN.textContent = prayerName(next);
  elT.textContent = fmt12(next.h, next.mi);
  elC.innerHTML = 'بعد <b>' + humanRemaining(Math.max(0, Math.round(leftM*60))) + '</b>';
}

// top left: the day's prayers with sunrise and the middle of the night; the next one (prayer or event) is boxed
// in gold. The time left to it is in the bottom panel only. Between adhan and iqama the prayer that has come stays boxed.
function renderPrayerStrip(mins){
  const strip = document.getElementById('pt-strip');
  if(!strip || !PRAYERS.length) return;
  const at = x => x.h*60 + x.mi;
  const items = PRAYERS.slice();
  const sr = minutesOf('Sunrise', null);
  if(sr != null) items.splice(1, 0, {aux:true, name:'الشروق', h:Math.floor(sr/60), mi:sr%60});
  const mg = PRAYERS.find(x => x.key === 'Maghrib'), fj = PRAYERS[0];
  if(mg && fj){
    const mid = Math.round(at(mg) + (at(fj) + 1440 - at(mg)) / 2) % 1440;
    items.push({aux:true, name:'منتصف الليل', h:Math.floor(mid/60), mi:mid%60});
  }
  const cur = PRAYERS.find(x => {
    const gap = (x.key === 'Dhuhr' && isFriday()) ? 0 : (CONFIG.iqama[x.key] || 0);
    return mins >= at(x) && mins < at(x) + gap;
  });
  // the next of all of them, across midnight
  const ahead = x => ((at(x) - mins) % 1440 + 1440) % 1440 || 1440;
  const lit = cur || items.reduce((a, x) => ahead(x) < ahead(a) ? x : a, items[0]);
  setHTML(strip, items.map(x => {
    const passed = x !== lit && at(x) <= mins;
    const cls = x === lit ? 'next' : passed ? 'past' : x.aux ? 'aux' : '';
    const h12 = x.h % 12 === 0 ? 12 : x.h % 12;
    return `<span class="q ${cls}"><span class="n">${x.aux ? x.name : prayerName(x)}</span><span class="t">${ar(h12)}:${ar(pad(x.mi))}<small>${x.h < 12 ? 'ص' : 'م'}</small></span></span>`;
  }).join(''));
}

// ---------- alerts under the clock ----------
const WARN_ICON = c => `<svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z" fill="${c}"/><path d="M12 9v5" stroke="#1a1208" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="#1a1208"/></svg>`;
const pill = (cls, text, icon) => `<span class="al ${cls}">${icon || ''}<span>${text}</span></span>`;
const SEV = {1:['w1','منخفضة','#F2D46B'], 2:['w2','متوسطة','#F2A24B'], 3:['w3','عالية','#F06A5A']};
let DUST_PM = 0;
const digitsOf = s => +String(s).replace(/[^0-9]/g, '');
function hijriOf(d){
  const p = IDF('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,day:'numeric',month:'numeric'})
    .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
  return {m: digitsOf(p.month), d: digitsOf(p.day)};
}
const weekdayOf = d => IDF('en-US',{timeZone:CONFIG.timezone,weekday:'short'}).format(d);
// why a day is a fasting day (Umm al-Qura); none on the Eids, the days of Tashreeq and in Ramadan
function fastReasons(d){
  const h = hijriOf(d), wd = weekdayOf(d), out = [];
  if(h.m === 9 || (h.m === 10 && h.d === 1) || (h.m === 12 && h.d >= 10 && h.d <= 13)) return out;
  if(h.m === 12 && h.d === 9) out.push('يوم عرفة');
  if(h.m === 1 && h.d === 9) out.push('تاسوعاء');
  if(h.m === 1 && h.d === 10) out.push('عاشوراء');
  if(h.m === 10 && h.d >= 2) out.push('الست من شوال');
  if(h.d >= 13 && h.d <= 15) out.push('الأيام البيض');
  if(wd === 'Mon') out.push('الاثنين');
  if(wd === 'Thu') out.push('الخميس');
  return out;
}
function weatherAlerts(){
  const out = [], t = FORECAST[0];
  const add = (lvl, text) => { const [c, word, col] = SEV[lvl]; out.push(pill(c, `${text} <small>· خطورة ${word}</small>`, WARN_ICON(col))); };
  if(DUST_PM >= 400) add(3, 'غبار كثيف'); else if(DUST_PM >= 150) add(2, 'غبار');
  const codes = [WX_NOW, t && t.code].filter(c => typeof c === 'number');
  if(codes.some(c => c >= 95)) add(3, 'عواصف رعدية');
  else if(codes.some(c => c === 65 || c === 82 || c === 67)) add(3, 'أمطار غزيرة');
  else if(codes.some(c => (c >= 61 && c <= 66) || c === 80 || c === 81)) add(2, 'أمطار');
  else if(codes.some(c => c >= 51 && c <= 57)) add(1, 'رذاذ');
  if(codes.some(c => c === 45 || c === 48)) add(2, 'ضباب');
  if(t && t.hi >= 48) add(3, `حرارة شديدة ${ar(Math.round(t.hi))}°`);
  else if(t && t.hi >= 45) add(2, `حرارة عالية ${ar(Math.round(t.hi))}°`);

function matchAlerts(now){
  const out = [], seen = new Set();
  CONFIG.teamIds.forEach(id => {
    const ev = MATCHES[id];
    if(!ev || !ev.idEvent || seen.has(ev.idEvent)) return;
    seen.add(ev.idEvent);
    const t = toDate(ev).getTime(), mine = String(ev.idHomeTeam) === id;
    const me = teamAr(mine ? ev.strHomeTeam : ev.strAwayTeam), them = teamAr(mine ? ev.strAwayTeam : ev.strHomeTeam);
    const scored = ev.intHomeScore != null && ev.intAwayScore != null;
    if(now >= t && now < t + 2.5*3600000 && !FINAL.includes((ev.strStatus || '').toUpperCase()))
      out.push(pill('live', `مباشر: ${esc(teamAr(ev.strHomeTeam))} ${scored ? ar(+ev.intHomeScore) + ' - ' + ar(+ev.intAwayScore) : '×'} ${esc(teamAr(ev.strAwayTeam))}`));
    else if(t > now && t - now <= 3*3600000)
      out.push(pill('match', `${esc(me)} يلعب بعد ${humanRemaining(Math.round((t - now)/1000))} <small>ضد ${esc(them)}</small>`));
  });
  return out;
}
function renderAlerts(){
  const box = document.getElementById('alerts');
  if(!box || CONFIG.widget) return;
  const now = Date.now(), p = riyadhParts(), mins = p.h*60 + p.mi + p.s/60, out = [];
  const at = x => x.h*60 + x.mi;
  const maghrib = minutesOf('Maghrib', 18*60);
  // prayer: 10 minutes before the adhan
  const next = PRAYERS.find(x => at(x) > mins && at(x) - mins <= 10);
  if(next) out.push(pill('prayer', `${prayerName(next)} بعد ${humanRemaining(Math.max(60, Math.round((at(next) - mins)*60)))}`));
  // Friday: from Thursday's Maghrib to Friday's Maghrib, and the hour and a half before the Friday prayer
  const wd = weekdayOf(new Date());
  if((wd === 'Thu' && mins >= maghrib) || (wd === 'Fri' && mins < maghrib)){
    out.push(pill('fri', 'قراءة سورة الكهف'));
    out.push(pill('fri', 'أكثروا من الصلاة على النبي <span class="saw">ﷺ</span>'));
  }
  const dh = PRAYERS.find(x => x.key === 'Dhuhr');
  if(wd === 'Fri' && dh && at(dh) - mins > 10 && at(dh) - mins <= 90)
    out.push(pill('fri', `صلاة الجمعة بعد ${humanRemaining(Math.round((at(dh) - mins)*60))} <small>· التبكير إليها</small>`));
  // fasting: today until Maghrib, then tomorrow
  const day = mins < maghrib ? new Date() : new Date(now + 86400000);
  const why = fastReasons(day);
  if(why.length) out.push(pill('fast', `${mins < maghrib ? 'اليوم' : 'غداً'}: صيام ${why.join('، ')}`));
  out.push(...bedtimeAlerts(now), ...gameAlerts(now), ...reminderAlerts(), ...taskAlerts(), ...seriesAlerts(now), ...matchAlerts(now), ...weatherAlerts());
  setHTML(box, out.join(''));
  renderAdhan(mins);
}

function occasionDates(){
  const dayKey = IDF('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  if(OCC_CACHE.day === dayKey) return OCC_CACHE.list;
  const today = riyadhParts(), t0 = Date.UTC(today.y, today.mo-1, today.d);
  const hf = IDF('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,day:'numeric',month:'numeric',year:'numeric'});
  const found = {};
  for(let i = 0; i < 400; i++){       // the next date of each Hijri occasion, today included
    const d = new Date(Date.now() + i*86400000);
    const hp = hf.formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});
    const hm = +String(hp.month).replace(/[^0-9]/g,''), hd = +String(hp.day).replace(/[^0-9]/g,'');
    OCCASIONS.forEach((o, k) => {
      if(o.hijri && found[k] === undefined && o.hijri[0] === hm && o.hijri[1] === hd){
        const p = riyadhParts(d);
        found[k] = {t: Date.UTC(p.y, p.mo-1, p.d), hy: +String(hp.year).replace(/[^0-9]/g,'')};
      }
    });
  }
  const list = OCCASIONS.map((o, k) => {
    let t, label;
    if(o.hijri){
      if(!found[k]) return null;
      t = found[k].t; label = o.name + ' ' + ar(found[k].hy);
    }else{
      let y = today.y;
      t = Date.UTC(y, o.greg[0]-1, o.greg[1]);
      if(t < t0){ y++; t = Date.UTC(y, o.greg[0]-1, o.greg[1]); }
      label = o.year === 'national' ? o.name + ' ' + ar(y - 1930) : o.name;
    }
    return {o, t, label, ic: o.ic, days: Math.round((t - t0) / 86400000)};
  }).filter(Boolean);
  // the next (or current) school holiday, from assets/shared/school-holidays.json
  const ymd = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m-1, d); };
  const hol = SCHOOL.holidays.map(h => ({h, from: ymd(h.from), to: ymd(h.to)})).find(x => x.to >= t0);
  if(hol){
    const len = Math.round((hol.to - hol.from) / 86400000) + 1;   // both ends included
    const lenWord = len === 2 ? 'يومان' : len >= 3 && len <= 10 ? ar(len) + ' أيام' : ar(len) + ' يوماً';
    list.push({o: {name: hol.h.name + ' (' + lenWord + ')', greet: 'إجازة سعيدة'}, school: hol, t: hol.from, ic: 'school',
      label: 'الإجازة القادمة · ' + hol.h.name + ' (' + lenWord + ')', days: Math.max(0, Math.round((hol.from - t0) / 86400000))});
  }
  list.sort((a, b) => a.t - b.t);
  OCC_CACHE = {day: dayKey, list};
  return list;
}

const TL_WORDS = {the:'ذا',of:'أوف',and:'آند',a:'إيه',in:'إن',on:'أون',to:'تو',us:'أس',fc:'',cf:'',sc:'',afc:'',
  united:'يونايتد',city:'سيتي',real:'ريال',club:'كلوب',sporting:'سبورتنغ',saint:'سانت',st:'سانت'};
const TL_LETTERS = {a:'إيه',b:'بي',c:'سي',d:'دي',e:'إي',f:'إف',g:'جي',h:'إتش',i:'آي',j:'جيه',k:'كيه',l:'إل',m:'إم',
  n:'إن',o:'أو',p:'بي',q:'كيو',r:'آر',s:'إس',t:'تي',u:'يو',v:'في',w:'دبليو',x:'إكس',y:'واي',z:'زد'};
function translit(en){
  const map = {sh:'ش',kh:'خ',th:'ث',dh:'ذ',gh:'غ',ch:'تش',ph:'ف',ck:'ك',qu:'كو',ou:'و',oo:'و',ee:'ي',
    a:'ا',b:'ب',c:'ك',d:'د',e:'ي',f:'ف',g:'ج',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',o:'و',p:'ب',
    q:'ق',r:'ر',s:'س',t:'ت',u:'و',v:'ف',w:'و',x:'كس',y:'ي',z:'ز'};
  const start = {a:'أ',e:'إ',i:'إ',o:'أو',u:'أ'};
  const word = w => {
    if(hasArabic(w) || !/[A-Za-z0-9]/.test(w)) return w;
    const lw = w.toLowerCase();
    if(TL_WORDS[lw] !== undefined) return TL_WORDS[lw];
    if(/^[A-Z]{2,4}$/.test(w)) return lw.split('').map(c=>TL_LETTERS[c]).join(' ');   // CP, PSG
    if(/^al-/.test(lw)) return 'ال' + word(w.slice(3));
    let out = '', x = lw.replace(/(.)\1/g,'$1');
    for(let i = 0; i < x.length;){
      const two = i+1 < x.length ? map[x.slice(i,i+2)] : undefined;
      if(i === 0 && start[x[0]] && !two){ out += start[x[0]]; i++; continue; }
      if(two){ out += two; i += 2; continue; }
      const ch = x[i];
      if(ch === 'e' && i > 0){ i++; continue; }                         // short or silent e
      if(ch === 'c' && /[eiy]/.test(x[i+1] || '')){ out += 'س'; i++; continue; }
      out += /[0-9]/.test(ch) ? ar(ch) : (map[ch] || '');
      i++;
    }
    return out;
  };
  return String(en).replace(/&/g,' و ').replace(/\bAl (?=[A-Z])/g,'Al-')
    .split(/(\s+)/).map(word).join('').replace(/\s{2,}/g,' ').trim();
}

async function wikidataArabic(en, kind){
  const api = 'https://www.wikidata.org/w/api.php?format=json&origin=*';
  const r = await fetchT(`${api}&action=wbsearchentities&type=item&limit=7&language=en&search=${encodeURIComponent(en)}`, 10000);
  const hits = ((await r.json()).search || []).filter(h => AR_KIND[kind].test(h.description || ''));
  if(!hits.length) return '';
  const r2 = await fetchT(`${api}&action=wbgetentities&props=labels&languages=ar&ids=${hits.slice(0,3).map(h=>h.id).join('|')}`, 10000);
  const ents = (await r2.json()).entities || {};
  for(const h of hits.slice(0,3)){
    const l = ents[h.id] && ents[h.id].labels && ents[h.id].labels.ar;
    if(l && l.value) return l.value.replace(/\s*\([^)]*\)\s*/g,' ').replace(/^(نادي|فريق)\s+/,'').trim();
  }
  return '';
}

function toDate(ev){

// one slot per picked team: a result from the last 24h, else a fixture this week, else hidden
// A game is over once its status says so, or 2.5 h after kick-off; its score stays up for a day after that.
const FINAL = ['FT','AET','PEN','MATCH FINISHED'];
function finishedRecently(ev, now){
  if(!ev || ev.intHomeScore == null || ev.intAwayScore == null) return false;
  const k = toDate(ev).getTime(), end = k + 2.5*3600000;
  const over = FINAL.includes((ev.strStatus || '').toUpperCase()) ? now >= k : now >= end;
  return over && now - end < 86400000;
}
// Keep a score seen at the final whistle: the free API's "last games" list can lag, and "next game"
// moves on to the following fixture right away. Saved, so a restart within the day still shows it.
const KEPT = (()=>{ try{ return JSON.parse(localStorage.getItem('keptResults') || '{}'); }catch(e){ return {}; } })();
function keepResult(id, ev){
  if(!finishedRecently(ev, Date.now())) return;
  KEPT[id] = [ev, ...(KEPT[id] || []).filter(x => x.idEvent !== ev.idEvent && finishedRecently(x, Date.now()))];
  try{ localStorage.setItem('keptResults', JSON.stringify(KEPT)); }catch(e){}
}
function resultsFor(id){
  const seen = new Set();
  return [...(RESULTS[id] || []), ...(KEPT[id] || []), MATCHES[id]]

// ---------- full rounds: the free API lists only 3 games for a day, but a whole round (all its games) ----------
const SDB = () => `https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}`;
const ROUND_CACHE = {}, NEXT_CACHE = {};   // "league|round|season" / league -> {at, ...}
// the free API allows about 30 calls a minute for the whole home (both TVs share one address): one at a time, 4 s apart
let SDB_SLOT = 0;
async function sdbGet(path){
  const now = Date.now(), wait = Math.max(0, SDB_SLOT - now);
  SDB_SLOT = Math.max(now, SDB_SLOT) + 4000;
  if(wait) await new Promise(r => setTimeout(r, wait));
  return getJSON(`${SDB()}/${path}`, null);
}
async function roundEvents(league, round, season, maxAgeMs){
  const key = league + '|' + round + '|' + season, c = ROUND_CACHE[key];
  if(c && Date.now() - c.at < maxAgeMs) return c.events;
  const path = `eventsround.php?id=${league}&r=${round}&s=${encodeURIComponent(season)}`;
  const j = await sdbGet(path) || await sdbGet(path);   // one retry
  if(!j) return c ? c.events : null;                     // failed: null, not "no games"
  const events = j.events || [];
  ROUND_CACHE[key] = {at: Date.now(), events};
  return events;
}
const SDB_FAIL = {};   // a call that got no answer: not the same as "no games"
async function nextOfLeague(league){
  const c = NEXT_CACHE[league];
  if(c && Date.now() - c.at < 10*60000) return c.ev;
  const path = `eventsnextleague.php?id=${league}`;
  const j = await sdbGet(path) || await sdbGet(path);
  if(!j) return c ? c.ev : SDB_FAIL;
  const ev = j.events && j.events[0] || null;
  NEXT_CACHE[league] = {at: Date.now(), ev};
  return ev;
}
// a league's games between `fromMs` and `toMs`, round by round. The API's "next" game can be an old postponed
// one, so rounds that are wholly past are skipped until the upcoming ones; a past round is kept for a day.
async function leagueGames(league, fromMs, toMs, maxAgeMs){
  const nx = await nextOfLeague(league);
  if(nx === SDB_FAIL) return null;
  if(!nx) return [];
  const r = parseInt(nx.intRound, 10);
  if(!r || r > 500){   // cups name their rounds oddly: just the next game
    const t = toDate(nx).getTime();
    return t >= fromMs && t <= toMs ? [nx] : [];
  }
  const out = [];
  for(let i = -1; i < 14 && r + i > 0; i++){
    const evs = await roundEvents(league, r + i, nx.strSeason, maxAgeMs);
    if(evs === null) return null;   // a round that did not answer: the caller keeps what it had
    if(!evs.length) break;
    const ts = evs.map(e => toDate(e).getTime());
    if(Math.max(...ts) < fromMs){ ROUND_CACHE[league + '|' + (r + i) + '|' + nx.strSeason].at = Date.now() + 18*3600000; continue; }
    evs.forEach((e, k) => { if(ts[k] >= fromMs && ts[k] <= toMs) out.push(e); });
    if(Math.min(...ts) > toMs) break;
  }
  return out;
}

async function loadTeamFixtures(){
  const mine = new Set(CONFIG.teamIds), now = Date.now(), seen = new Set(), out = [];
  for(const league of await teamLeagues()){
    for(const ev of (await leagueGames(league, now - 86400000, now + 30*86400000, 6*3600000)) || []){

let TODAY_GAMES = [], TODAY_BY = {}, TODAY_DONE = new Set(), TODAY_DAY = '';

  if(v && v.day === IDF('en-CA',{timeZone:CONFIG.timezone}).format(new Date())){ TODAY_DAY = v.day; TODAY_BY = v.by || {}; }
}catch(e){} })();
async function loadToday(){
  const day = IDF('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  if(day !== TODAY_DAY){ TODAY_DAY = day; TODAY_BY = {}; TODAY_DONE = new Set(); }
  for(const [rank, [id, name]] of TOP_LEAGUES.entries()){
    const games = await leagueGames(id, Date.now() - 86400000, Date.now() + 86400000, 20*60000);   // live scores: refreshLive
    if(games === null) continue;
    TODAY_BY[id] = games.filter(ev => riyadhDay(toDate(ev)) === day).map(ev => ({ev, rank, lg: name}));
    TODAY_DONE.add(id);
    buildToday();   // each league as it arrives
  }
  try{ localStorage.setItem('todayGames', JSON.stringify({day, by: TODAY_BY})); }catch(e){}
}
function buildToday(){
  const got = TOP_LEAGUES.map(([id]) => TODAY_BY[id] || []);
  const mine = new Set(CONFIG.teamIds);
  const now = Date.now();
  TODAY_GAMES = got.flat().filter(Boolean).map(x => Object.assign(x, {t: toDate(x.ev).getTime(),
      mine: mine.has(String(x.ev.idHomeTeam)) || mine.has(String(x.ev.idAwayTeam))}))
    .sort((a, b) => (gameState(b, now) === 'live') - (gameState(a, now) === 'live') || b.mine - a.mine || a.rank - b.rank || a.t - b.t);
  renderMatches();
}
function gameState(x, now){
  const ev = x.ev, scored = ev.intHomeScore != null && ev.intAwayScore != null;
  if(FINAL.includes((ev.strStatus || '').toUpperCase()) || (scored && now > x.t + 2.5*3600000)) return 'done';
  if(now >= x.t) return 'live';
  return 'next';
}
function todaySlot(x, now){
  const ev = x.ev, st = gameState(x, now), hs = +ev.intHomeScore, as = +ev.intAwayScore;
  const scored = ev.intHomeScore != null && ev.intAwayScore != null;
  let hc = '', ac = '';
  if(st === 'done' && scored){ if(hs > as){ hc = 'wn'; ac = 'ls'; } else if(hs < as){ hc = 'ls'; ac = 'wn'; } }
  const mid = scored && st !== 'next' ? ` <span class="sc">${ar(hs)} - ${ar(as)}</span> ` : ' × ';
  const p = IDF('en-GB',{timeZone:CONFIG.timezone,hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(new Date(x.t)).reduce((a, y) => (a[y.type] = y.value, a), {});
  const when = st === 'done' ? (scored && hs === as ? 'تعادل' : 'انتهت')
    : st === 'live' ? `<span class="live">مباشر</span>${ev.strProgress && !isNaN(parseInt(ev.strProgress, 10)) ? ' · الدقيقة ' + ar(parseInt(ev.strProgress, 10)) : ''}`
    : fmt12(+p.hour % 24, +p.minute);
  return `<div class="mblock"><div class="big"><span><span class="${hc}">${homeSide(ev)}</span>${mid}<span class="${ac}">${awaySide(ev)}</span></span></div>`
       + `<div class="sub">${x.lg} · ${when}</div></div>`;
}
let MATCH_PAGE = 0;
function renderMatches(turn){
  const now = Date.now();
  const slots = TODAY_GAMES.map(x => todaySlot(x, now));
  const row = document.getElementById('match-row');
  if(!slots.length){
    const all = TOP_LEAGUES.every(([id]) => TODAY_DONE.has(id));
    // still loading: keep what is shown (the saved games), never a false «none»
    if(all) setHTML(row, '<div class="none-week">لا مباريات اليوم</div>');
    else if(!row.querySelector('.mblock')) setHTML(row, '<div class="none-week" style="opacity:.6">جارٍ تحميل المباريات…</div>');
    return;
  }
  const per = CONFIG.matchesPerPage, pages = Math.ceil(slots.length / per);
  if(turn) MATCH_PAGE++;
  MATCH_PAGE %= pages;
  const html = slots.slice(MATCH_PAGE * per, MATCH_PAGE * per + per).join('');
  if(turn && pages > 1 && row.__h !== html) crossfade(row, () => setHTML(row, html)); else setHTML(row, html);
}

async function fetchLast(id){
  const r = await fetch(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/eventslast.php?id=${id}`,{cache:'no-store'});
  if(!r.ok) throw 0;
  const j = await r.json();
  return j.results || [];
}
async function loadMatches(){
  // never throw away a good fixture or result on a failed refresh
  let answered = 0;
  await Promise.all(CONFIG.teamIds.map(async id=>{
    try{
      const ev = await fetchNext(id); answered++;
      if(ev){ if(MATCHES[id] && MATCHES[id].idEvent !== ev.idEvent) keepResult(id, MATCHES[id]); MATCHES[id] = ev; }
    }catch(e){}
    try{ const l = await fetchLast(id); answered++; if(l.length) RESULTS[id] = l; }catch(e){}
  }));
  if(!answered && CONFIG.teamIds.length) return;    // offline: keep what is shown (the saved panels)
  renderMatches();
  renderAlerts();
  if(CONFIG.panel === 'matches') renderPanel(false);
}

async function fetchT(url, ms){
  const c = new AbortController(); const id = setTimeout(()=>c.abort(), ms||12000);
  try{ return await fetch(url,{cache:'no-store', signal:c.signal}); }
  finally{ clearTimeout(id); }
}

const SKIP_TYPES = ['News','Talk Show','Sports','Game Show'];
let NET_OK = 0;   // answers received; a refresh that got none must not replace what is on screen
async function getJSON(url, fallback){
  try{ const r = await fetchT(url, 12000); if(!r.ok) return fallback; const j = await r.json(); NET_OK++; return j; }
  catch(e){ return fallback; }
}
async function loadWeek(){
  const F = CONFIG.shows, seen = new Set(), out = [], answered = NET_OK;
  const days = [];
  for(let i=0;i<7;i++) days.push(IDF('en-CA',{timeZone:CONFIG.timezone}).format(new Date(Date.now()+i*86400000)));
  const inWeek = d => d && d >= days[0] && d <= days[6];
  const add = (s, e, picked) => {
    if(!s || !s.name || seen.has(s.name)) return;
    seen.add(s.name);
    const prem = e.number === 1;
    out.push({
      name: s.name,
      ep: e.season ? (prem ? `الموسم ${ar(e.season)}` : `الموسم ${ar(e.season)} · ح ${ar(e.number)}`) : '',
      date: e.airdate || '',
      rating: (s.rating && s.rating.average) || 0,
      prem, picked
    });
  };

  // shows picked one by one: their next episode, if it airs this week
  const picked = await Promise.all(F.ids.map(id => getJSON(`https://api.tvmaze.com/shows/${id}?embed=nextepisode`, null)));
  picked.forEach(s => {
    const e = s && s._embedded && s._embedded.nextepisode;
    if(e && inWeek(e.airdate)) add(s, e, true);
  });

  // the schedule, narrowed by genre and language; skipped when only picked shows were chosen
  if(!F.ids.length || F.genres.length || F.langs.length){
    const lists = await Promise.all(days.flatMap(dt => [
      getJSON(`https://api.tvmaze.com/schedule/web?date=${dt}`, []),
      ...F.countries.map(c => getJSON(`https://api.tvmaze.com/schedule?country=${encodeURIComponent(c)}&date=${dt}`, []))
    ]));
    lists.flat().forEach(e => {
      const s = e.show || (e._embedded && e._embedded.show) || {};
      if(s.type && SKIP_TYPES.includes(s.type)) return;
      if(s.genres && s.genres.includes('Soap')) return;   // no daytime soaps
      if(!e.number || e.number < 1) return;
      if(e.season && e.season > 15) return;               // keep it to real series
      if(((s.rating && s.rating.average) || 0) < F.minRating) return;
      if(F.genres.length && !(s.genres || []).some(g => F.genres.includes(g))) return;
      if(F.langs.length && !F.langs.includes(s.language)) return;
      add(s, e, false);
    });
  }

  // nothing answered (offline): keep the saved list if one is shown
  if(NET_OK === answered && document.querySelector('#week-list li:not(.empty)')) return;
  if(out.length){                                   // keep the last good list on a failed refresh
    WEEK_POOL = out.sort((a,b)=> (b.picked - a.picked) || (b.prem - a.prem) || a.date.localeCompare(b.date)).slice(0, 50);
    WEEK_PAGE = 0;
  }
  renderWeekPage(false);
}

const WEEK_ROWS = 5;
let WEEK_POOL = [];
let WEEK_PAGE = 0;

function renderWeekPage(animate){
  const ul = document.getElementById('week-list');
  if(!WEEK_POOL.length){
    ul.classList.remove('flip');
    ul.innerHTML = '<li class="empty">لا جديد هذا الأسبوع</li>';
    return;
  }
  const start = (WEEK_PAGE * WEEK_ROWS) % WEEK_POOL.length;
  const rows = [];
  for(let i = 0; i < Math.min(WEEK_ROWS, WEEK_POOL.length); i++){
    rows.push(WEEK_POOL[(start + i) % WEEK_POOL.length]);
  }
  ul.innerHTML = rows.map(o=>{
    const dt = o.date ? IDF(GREG,{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date(o.date+'T12:00:00Z')) : '';
    return `<li><span>${esc(o.name)}</span>`
         + (o.ep?`<span class="ep">${ar(o.ep)}</span>`:'')
         + (o.rating ? `<span class="rt">${ar(o.rating.toFixed(1)).replace('.','٫')}</span>` : '')
         + (dt?`<span class="dt">${dt}</span>`:'') + '</li>';
  }).join('');
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

let DHIKR_TURN = 0;
const COUNT_WORD = n => n === 1 ? 'مرة واحدة' : n === 3 ? 'ثلاث مرات' : n === 10 ? 'عشر مرات' : n === 100 ? 'مئة مرة' : ar(n) + ' مرات';
function adhkarTime(){
  const p = riyadhParts(), m = p.h*60 + p.mi;
  if(m >= minutesOf('Fajr', 4*60+30) && m < minutesOf('Dhuhr', 12*60)) return 'm';
  if(m >= minutesOf('Asr', 15*60) && m < minutesOf('Isha', 19*60)) return 'e';
  return null;
}
function dhikrSlide(when){
  const list = ADHKAR.filter(x => x.when === when || x.when === 'b');
  const x = list[DHIKR_TURN % list.length];
  const src = Object.keys(x.found).join(' و');
  const body = x.quran ? `<span class="orn">﴿</span>${esc(x.text)}<span class="orn">﴾</span>` : esc(x.text);
  return {title: (when === 'm' ? 'أذكار الصباح' : 'أذكار المساء') + ` · ${ar(DHIKR_TURN % list.length + 1)}/${ar(list.length)}`,
    rows: [x.title ? `<li class="mh">${esc(x.title)}</li>` : '', `<li class="quote">${body}</li>`,
      `<li class="src">${COUNT_WORD(x.count)}</li>`, `<li class="bio">${x.quran ? 'ثبت فضلها صباحاً ومساءً في ' : 'رواه '}${esc(src)}</li>`].filter(Boolean)};
}
function cardSlides(){
  const day = riyadhDayNumber(), slides = [];
  const dk = adhkarTime();
  if(dk && ADHKAR.length && cardOn('adhkar')) slides.push(() => dhikrSlide(dk));
  if(VERSES.length && cardOn('verse')) slides.push(() => verseOfDay(day));
  if(HADITH.length && cardOn('hadith')) slides.push(() => hadithOfDay(day));
  if(WISDOM.length && cardOn('wisdom')) slides.push(() => wisdomOfDay(day));
  if(cardOn('tasks') && ((CTRL.tasks || []).some(t => !t.done) || todaysReminders().length)) slides.push(() => tasksSlide());
  const bt = nextBedtime();
  if(bt && cardOn('bedtime') && bt.t - Date.now() <= 3*3600000) slides.push(() => bedtimeSlide());
  if(cardOn('series') && seriesItems().length) slides.push(() => seriesSlide());
  if(FORECAST.length && cardOn('weather')) slides.push(() => ({title: PANEL_TITLE.forecast, rows: forecastRows()}));
  const m = matchCard();
  if(m.length && cardOn('matches')) slides.push(() => ({title: PANEL_TITLE.matches, rows: m}));
  return slides;
}
function rotatingCard(){
  const slides = cardSlides();
  const dots = document.getElementById('card-dots');
  if(dots) dots.innerHTML = slides.length > 1
    ? slides.map((_, i) => `<i class="${i === CARD_TURN % slides.length ? 'on' : ''}"></i>`).join('') : '';
  return slides.length ? slides[CARD_TURN % slides.length]() : quoteOfDay();
}
// the card leaves downward and the next one comes in from above, slowly
function turnCard(){
  const body = document.getElementById('wbody');
  if(adhkarTime() && CARD_TURN % cardSlides().length === 0) DHIKR_TURN++;   // the dhikr slide just left: next one next time
  CARD_TURN++;
  crossfade(body, () => renderPanel(false));
}

const PICK_KIND = {proverb:'مثل', verse:'شعر', saying:'قول مأثور', poet:'شاعر اليوم'};
function wisdomOfDay(day){
  const w = WISDOM[day % WISDOM.length];
  const title = 'مختارات · ' + (PICK_KIND[w.k] || '');
  if(w.k === 'proverb') return {title, rows:[
    `<li class="quote">«${esc(w.text)}»</li>`, `<li class="bio">${esc(w.note)}</li>`]};
  if(w.k === 'verse'){
    const [a, b] = w.text.split('…').map(x => esc(x.trim()));
    return {title, rows:[`<li class="quote verse2">${a}<br>${b || ''}</li>`,
      `<li class="src">${esc(w.who)}</li>`, `<li class="bio">${esc(w.bio)}</li>`]};
  }
  if(w.k === 'poet') return {title, rows:[`<li class="quote">${esc(w.who)}</li>`, `<li class="bio">${esc(w.bio)}</li>`]};
  return {title, rows:[`<li class="quote">«${esc(w.text)}»</li>`,
    `<li class="src">${esc(w.who)}</li>`, `<li class="bio">${esc(w.bio)}</li>`]};
}

// long texts (a long hadith) shrink a little so the card never changes size
function fitCard(ul){
  ul.style.zoom = '';
  for(let k = 1; k > .6 && ul.scrollHeight > ul.clientHeight + 2; k -= .05) ul.style.zoom = k.toFixed(2);
}

// #panel=home (the home screen's card): the next prayer large, the day's prayers small, and the next occasion
function homeRows(){
  if(!PRAYERS.length) return [];
  const p = riyadhParts(), mins = p.h*60 + p.mi + p.s/60, at = x => x.h*60 + x.mi;
  let next = PRAYERS.find(x => at(x) > mins);
  const left = next ? at(next) - mins : at(PRAYERS[0]) + 1440 - mins;
  if(!next) next = PRAYERS[0];
  const strip = PRAYERS.map(x => `<span class="${x === next ? 'on' : ''}"><b>${prayerName(x)}</b>${fmt12(x.h, x.mi)}</span>`).join('');
  const occ = occasionDates()[0];
  const occLine = !occ ? '' : occ.days <= 0 ? `${esc(occ.label)} · ${esc(occ.o.greet)}`
    : `${esc(occ.label)} · متبقي ${occ.days === 2 ? 'يومين' : ar(occ.days) + (occ.days >= 3 && occ.days <= 10 ? ' أيام' : ' يوم')}`;
  return [`<li class="hm1"><span>${prayerName(next)} ${fmt12(next.h, next.mi)}</span><small>بعد ${humanRemaining(Math.max(0, Math.round(left*60)))}</small></li>`,
          `<li class="hm2">${strip}</li>`, occLine ? `<li class="hm3">${occLine}</li>` : ''].filter(Boolean);
}

function renderPanel(animate){
  const ul = document.getElementById('week-list'), hd = document.getElementById('week-hd');
  const P = CONFIG.panel;
  if(P === 'shows'){ renderWeekPage(animate); return; }
  let rows = [];
  if(P === 'prayers') rows = prayerRows();
  else if(P === 'forecast') rows = forecastRows();
  else if(P === 'matches') rows = matchRows();
  else if(P === 'home'){ setCardTitle(hd, 'الصلاة القادمة'); ul.innerHTML = homeRows().join(''); return; }
  else if(P === 'verse'){ const q = CONFIG.widget ? quoteOfDay() : rotatingCard(); setCardTitle(hd, q.title); rows = q.rows; ul.innerHTML = rows.join(''); fitCard(ul); return; }
  if(PANEL_TITLE[P]) setCardTitle(hd, PANEL_TITLE[P]);
  if(!rows.length){
    ul.classList.remove('flip');
    ul.innerHTML = `<li class="empty">${P === 'matches' ? 'لا مباريات هذا الأسبوع' : 'لا تتوفر بيانات الآن'}</li>`;
    return;
  }
  if(P === 'matches' && rows.length > WEEK_ROWS){        // page through, like the shows
    const start = (LIST_PAGE * WEEK_ROWS) % rows.length;
    rows = Array.from({length: WEEK_ROWS}, (_, i) => rows[(start + i) % rows.length]);
  }
  ul.innerHTML = rows.join('');
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

function prayerRows(){
  if(!DAY_TIMES) return [];
  const p = riyadhParts(), now = p.h * 60 + p.mi;
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr:isFriday() ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  let next = null;
  return Object.keys(names).filter(k => DAY_TIMES[k]).map(k => {
    const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number);
    const at = h * 60 + mi;
    let cls = at < now ? 'past' : '';
    if(at >= now && !next){ next = k; cls = 'next'; }
    return `<li class="${cls}"><span>${names[k]}</span><span class="dt">${fmt12(h, mi)}</span></li>`;
  });
}

function paintWeatherIcon(){
  const el = document.getElementById('wx-icon');
  if(el) el.innerHTML = WX_NOW == null ? '' : svgIcon(wxIcon(WX_NOW, isNight()));
}
// weather card: today large (icon, condition, high and low), the next four days small underneath
function forecastRows(){
  if(!FORECAST.length) return [];
  const t = FORECAST[0];
  const dayName = d => IDF(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
  const hero = `<li class="wx-hero"><span class="big-ic">${svgIcon(wxIcon(WX_NOW != null && WX_NOW !== 'dust' ? WX_NOW : t.code, isNight()))}</span>`
    + `<span class="wx-today"><b>${WX_CODES[t.code] || ''}</b></span>`
    + `<span class="wx-hl"><span><small>العظمى</small>${ar(Math.round(t.hi))}°</span><span class="lo"><small>الصغرى</small>${ar(Math.round(t.lo))}°</span></span></li>`;
  const days = FORECAST.slice(1, 5).map((d, i) =>
    `<span class="wx-d"><b>${i === 0 ? 'غداً' : dayName(d)}</b>${svgIcon(wxIcon(d.code, false))}`
    + `<span>${ar(Math.round(d.hi))}° <i>/</i> ${ar(Math.round(d.lo))}°</span></span>`).join('');
  return [hero, `<li class="wx-days">${days}</li>`];
}

// matches card: results first (the winner bright, the loser faded), then what is still to be played
function matchCard(){
  const now = Date.now(), seen = new Set(), evs = [];
  CONFIG.teamIds.forEach(id => {
    const next = NEXT_LIST[id] || (MATCHES[id] ? [MATCHES[id]] : []);
    next.forEach(ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(MATCHES[id] && MATCHES[id].idEvent === ev.idEvent ? MATCHES[id] : ev); } });
    resultsFor(id).forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  });
  TEAM_FIX.forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  const today = IDF('en-CA', {timeZone:CONFIG.timezone}).format(new Date());
  const items = evs.map(ev => ({ev, t: toDate(ev).getTime()}))
    .filter(x => finishedRecently(x.ev, now)
      || (now < x.t + 2.5*3600000 && !FINAL.includes((x.ev.strStatus || '').toUpperCase())
          && x.t - now <= CONFIG.weekWindowDays * 86400000))
    .sort((a, b) => a.t - b.t);
  const done = items.filter(x => finishedRecently(x.ev, now)).slice(-2);
  const rest = items.filter(x => !finishedRecently(x.ev, now));
  const row = ({ev, t}) => {
    const hs = ev.intHomeScore, as = ev.intAwayScore, scored = hs != null && as != null;
    const fin = finishedRecently(ev, now), live = !fin && now >= t && scored;
    let hc = '', ac = '';
    if(fin){ if(+hs > +as){ hc = 'win'; ac = 'lose'; } else if(+hs < +as){ hc = 'lose'; ac = 'win'; } }
    let mid, st;
    if(fin || live){
      mid = `<span class="sc2">${ar(+hs)} <i>-</i> ${ar(+as)}</span>`;
      st = `<span class="st ${live ? 'live' : ''}">${live ? 'مباشر' : (+hs === +as ? 'تعادل' : 'انتهت')}</span>`;
    }
    else {
      const d = new Date(t);
      const p = IDF('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
        .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
      const day = IDF('en-CA', {timeZone:CONFIG.timezone}).format(d) === today ? 'اليوم'
        : IDF(GREG, {timeZone:CONFIG.timezone, weekday:'long', day:'numeric', month:'long'}).format(d).replace('،', '');
      mid = `<span class="tm">${fmt12(+p.hour % 24, +p.minute)}</span>`;
      st = `<span class="st">${day} · بعد ${shortRemaining(t - now)}</span>`;
    }
    return `<li class="m3"><span class="tt ${hc}">${crest(ev.strHomeTeamBadge)}<span>${esc(teamAr(ev.strHomeTeam))}</span></span>`
         + `<span class="mid">${mid}</span>`
         + `<span class="tt a ${ac}"><span>${esc(teamAr(ev.strAwayTeam))}</span>${crest(ev.strAwayTeamBadge)}</span>${st}</li>`;
  };
  // results first, then the next 5 games; 4 games a page, the page turns every 10 s while the card is up
  const all = [...done.map(x => ['النتائج', x]), ...rest.slice(0, 5).map(x => ['القادمة', x])];
  const pages = Math.max(1, Math.ceil(all.length / 4));
  MATCH_PAGES = pages;
  const page = all.slice((MATCH_CARD_PAGE % pages) * 4, (MATCH_CARD_PAGE % pages) * 4 + 4);
  const out = [];
  page.forEach(([head, x], i) => { if(i === 0 || page[i-1][0] !== head) out.push(`<li class="mh">${head}${pages > 1 && i === 0 ? ` <span>${ar(MATCH_CARD_PAGE % pages + 1)}/${ar(pages)}</span>` : ''}</li>`); out.push(row(x)); });
  return out;
}
let MATCH_CARD_PAGE = 0, MATCH_PAGES = 1;

// every followed team's games this week, plus results from the last day, in time order
function matchRows(){
  const now = Date.now(), seen = new Set(), evs = [];
  CONFIG.teamIds.forEach(id => {
    const next = NEXT_LIST[id] || (MATCHES[id] ? [MATCHES[id]] : []);
    next.forEach(ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(MATCHES[id] && MATCHES[id].idEvent === ev.idEvent ? MATCHES[id] : ev); } });
    resultsFor(id).forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  });
  const day = d => IDF(GREG, {timeZone:CONFIG.timezone, weekday:'long'}).format(d);
  const today = IDF('en-CA', {timeZone:CONFIG.timezone}).format(new Date());
  return evs.map(ev => ({ev, t: toDate(ev).getTime()}))
    .filter(x => finishedRecently(x.ev, now)
      || (now < x.t + 2.5*3600000 && !FINAL.includes((x.ev.strStatus || '').toUpperCase())
          && x.t - now <= CONFIG.weekWindowDays * 86400000))
    .sort((a, b) => a.t - b.t)
    .map(({ev, t}) => {
      const d = new Date(t), scored = ev.intHomeScore != null && ev.intAwayScore != null;
      const mid = scored && now >= t ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
      const p = IDF('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
        .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
      const when = finishedRecently(ev, now) ? 'انتهت'
        : now >= t ? '<span class="live">مباشر</span>'
        : (IDF('en-CA', {timeZone:CONFIG.timezone}).format(d) === today ? 'اليوم' : day(d))
          + ' ' + fmt12(+p.hour % 24, +p.minute);
      return `<li><span>${homeSide(ev)}${mid}${awaySide(ev)}</span><span class="dt">${when}</span></li>`;
    });
}

 "surah": "سورة الإسراء", "ayah": 24}, {"text": "وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ وَلَا يَزِيدُ الظَّالِمِينَ إِلَّا خَسَارًا", "surah": "سورة الإسراء", "ayah": 82}, {"text": "إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا", "surah": "سورة الكهف", "ayah": 10}, {"text": "قَالَ لَا تَخَافَا إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَىٰ", "surah": "سورة طه", "ayah": 46}, {"text": "فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ وَلَا تَعْجَلْ بِالْقُرْآنِ مِنْ قَبْلِ أَنْ يُقْضَىٰ إِلَيْكَ وَحْيُهُ وَقُلْ رَبِّ زِدْنِي عِلْمًا", "surah": "سورة طه", "ayah": 114}, {"text": "وَأْمُرْ أَهْلَكَ بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا لَا نَسْأَلُكَ رِزْقًا نَحْنُ نَرْزُقُكَ وَالْعَاقِبَةُ لِلتَّقْوَىٰ", "surah": "سورة طه", "ayah": 132}, {"text": "وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة الأنبياء", "ayah": 83}, {"text": "وَذَا النُّونِ إِذْ ذَهَبَ مُغَاضِبًا فَظَنَّ أَنْ لَنْ نَقْدِرَ عَلَيْهِ فَنَادَىٰ فِي الظُّلُمَاتِ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", "surah": "سورة الأنبياء", "ayah": 87}, {"text": "وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ", "surah": "سورة المؤمنون", "ayah": 118}, {"text": "وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِ وَكَفَىٰ بِهِ بِذُنُوبِ عِبَادِهِ خَبِيرًا", "surah": "سورة الفرقان", "ayah": 58}, {"text": "وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا وَإِذَا خَاطَبَهُمُ الْجَاهِلُونَ قَالُوا سَلَامًا", "surah": "سورة الفرقان", "ayah": 63}, {"text": "وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ", "surah": "سورة الشعراء", "ayah": 80}, {"text": "رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", "surah": "سورة الشعراء", "ayah": 83}, {"text": "أَمَّنْ يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ وَيَجْعَلُكُمْ خُلَفَاءَ الْأَرْضِ أَإِلَٰهٌ مَعَ اللَّهِ قَلِيلًا مَا تَذَكَّرُونَ", "surah":
